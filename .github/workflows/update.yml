name: サイト更新
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
    - cron: '6,36 0 * * *' # JST 09:06 / 09:36。遅れたら毎時実行で補完。
  workflow_dispatch:
    inputs:
      line_test:
        description: '設定済みのLINE宛先へテストを1通送る'
        type: boolean
        default: false
      line_check:
        description: 'LINEの認証・残り枠だけ確認する（送信しない）'
        type: boolean
        default: false
      full:
        description: '日足履歴を取得し直す'
        type: boolean
        default: false
permissions:
  contents: write # market-stateに通知状態だけ保存。mainは変更しない。
  pages: write
  id-token: write
concurrency:
  group: market-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://pythonddd.github.io/Market
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 計算・通知の回帰テスト（送信しない）
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --selftest
          python scripts/chart.py --selftest
          python scripts/daily.py --selftest
      - name: フロントエンドの計算テスト
        run: node --test tests/core.test.cjs
      - name: 市場データを取得
        id: data
        continue-on-error: true
        env:
          FULL_REFRESH: ${{ inputs.full }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            python scripts/build.py --full --seed-url "$SITE_URL/data/history.json"
          else
            python scripts/build.py --auto --seed-url "$SITE_URL/data/history.json"
          fi
      - name: 通知状態を引き継ぐ（送信しない）
        id: ledger
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/state_store.py
      - name: LINE通知と診断
        id: line
        if: steps.ledger.outcome == 'success'
        continue-on-error: true # サイトは配信し、最後のステップで失敗を明示。
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN || secrets.LINE_CHANNEL_TOKEN || secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID || secrets.LINE_TO }}
          LINE_ENABLED: ${{ vars.LINE_ENABLED || 'true' }}
          LINE_DAILY_HOUR: ${{ vars.LINE_DAILY_HOUR || '9' }}
          TEST_LINE: ${{ inputs.line_test }}
          CHECK_LINE: ${{ inputs.line_check }}
        run: |
          if [ "$TEST_LINE" = "true" ]; then
            python scripts/notification.py --test
          elif [ "$CHECK_LINE" = "true" ]; then
            python scripts/notification.py --check
          else
            python scripts/notification.py
          fi
      - uses: actions/configure-pages@v5
        if: steps.data.outcome == 'success' && steps.ledger.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outcome == 'success' && steps.ledger.outcome == 'success'
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.data.outcome == 'success' && steps.ledger.outcome == 'success'
      - name: 診断ファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-diagnostics-${{ github.run_id }}
          path: docs/data/line_status.json
          retention-days: 14
          if-no-files-found: ignore
      - name: 失敗を成功表示にしない
        if: always() && (steps.line.outcome == 'failure' || steps.data.outcome == 'failure' || steps.ledger.outcome == 'failure')
        run: |
          echo '::error::データ取得またはLINE通知に失敗しました。通知ログ・Summary・診断ファイルを確認してください。'
          exit 1
